<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- jinja2 formatting -->
    <h1>you typed {{meal}}</h1>
    <p>score is {{data.health_score}}</p>

    <h1>So the Ingredients are: </h1>
    <ul>
        {% for i in data.ingredients %}
        <li>{{i}}</li>
        {%endfor%}
    </ul>

    <h1>Macros</h1>
    <ul>
        {% for i in data.macros %}
        <li>{{i}}</li>
        {%endfor%}
    </ul>

    <h1>Overall</h1>
    <p>{{data.verdict}}</p>

    <h1>Suggestion</h1>
    <p>{{data.suggestion}}</p>

    <a href="/">Try again for another meal</a>
</body>
</html>
