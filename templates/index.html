<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealTrack</title>
</head>
<body>
    <h1>Log a Meal</h1>

    <form action="/meals" method="POST">
        <label for="meal_type">Which meal are you logging?</label>

        <select id="meal_type" name="meal_type" required>
            <option value="" selected disabled>Select a meal type</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Lunch">Lunch</option>
            <option value="Snack">Snack</option>
            <option value="Dinner">Dinner</option>
        </select>

        <br><br>

        <label for="meal">What did you eat?</label>

        <input
            id="meal"
            name="meal"
            type="text"
            placeholder="Example: eggs, toast, and coffee"
            required
        >

        <br><br>

        <button type="submit">Add Meal</button>
    </form>

    <h2>Today's Meals</h2>

    {% if meals %}
        <ul>
            {% for meal in meals %}
                <li>
                    <strong>{{ meal["meal_type"] }}</strong> —
                    {{ meal["meal_name"] }}
                    ({{ meal["calories"] }} kcal)
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No meals logged today.</p>
    {% endif %}    

    <button>Delete</button>
    
</body>
</html>
